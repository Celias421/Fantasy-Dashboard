# Streamlit's built-in theme engine - sets the base colors every native
# widget (buttons, tabs, sliders, inputs, dataframes) derives from, so the
# brand colors apply even to components theme.py's CSS doesn't explicitly
# override. See theme.py for the full brand palette and the custom CSS
# layered on top of this for the parts Streamlit's theme system can't reach.
[theme]
base = "dark"
primaryColor = "#68F61F"
backgroundColor = "#0A0C0A"
secondaryBackgroundColor = "#14170F"
textColor = "#F4F5F1"
font = "sans serif"
